# Downloads the published web_* tabs of the alliance sheet and commits any changes to src/data/
# (plus a fingerprint of the members-only data, so changes there rebuild the site too).
# Each commit makes Cloudflare rebuild alliance.edenafk.com with the new data.
name: Refresh sheet data

on:
  schedule:
    - cron: '23 */3 * * *'   # every 3 hours
  workflow_dispatch: {}      # "Run workflow" button on GitHub, for an immediate update

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Download sheet data
        run: node scripts/fetch-data.mjs
      - name: Check the members-only data for changes
        # Saves only a fingerprint (src/data/members-stamp.txt), never the rows, so a change in the
        # current expedition still triggers a rebuild. Needs the MEMBERS_DATA_URL repository secret.
        env:
          MEMBERS_DATA_URL: ${{ secrets.MEMBERS_DATA_URL }}
        run: node scripts/fetch-private.mjs --stamp
      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain -- src/data)" ]; then
            echo "Sheet data unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add src/data
          git commit -m "Refresh alliance data from the sheet"
          git push
